# Deep review mypy configuration. Passed with --config-file, so the repository's own mypy settings are ignored.
# --strict, plus the extra checks below. No module is excluded and no error code is turned off: a missing third-party
# stub ([import-untyped] / [import-not-found]) is reported by deep_tools.py as a gap, never silenced.
# Inline "# type: ignore" is counted as a suppression issue.
[mypy]
strict = True
warn_unreachable = True
strict_equality = True
extra_checks = True
show_error_codes = True
show_column_numbers = True
pretty = False
